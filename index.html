
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding. -->
    <meta charset="UTF-8">

    <!-- Favicon 16x16 -->
    <link rel="icon" type="image/png" sizes="16x16"
        href="./assets/icons/favicon-16x16.png">

    <!-- Favicon 32x32 -->
    <link rel="icon" type="image/png" sizes="32x32"
        href="./assets/icons/favicon-32x32.png">

    <!-- Favicon 48x48 -->
    <link rel="icon" type="image/png" sizes="48x48"
        href="./assets/icons/favicon-48x48.png">

    <!-- Responsive layout and full-screen viewport support. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Application title. -->
    <title>APPLICATION_NAME</title>

    <!-- Application description. -->
    <meta name="description" content="Web application">

    <!-- Browser theme color. -->
    <meta name="theme-color" content="#ffffff">


    <!-- ============================================== -->
    <!-- WEB APP MANIFEST                               -->
    <!-- ============================================== -->

    <!-- Web App Manifest for supported browsers. -->
    <link rel="manifest" href="./manifest.json">


    <!-- ============================================== -->
    <!-- APPLE / iOS / iPadOS                           -->
    <!-- ============================================== -->

    <!-- iOS Home Screen application icon. -->
    <link rel="apple-touch-icon"
          sizes="180x180"  
          href="./assets/pwa/icons/apple-touch-icon.png">

    <!-- Enables standalone web app mode on iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- iOS status bar appearance. -->
    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <!-- Application name displayed on iOS Home Screen. -->
    <meta name="apple-mobile-web-app-title"
          content="APP_NAME">


    <!-- ============================================== -->
    <!-- APPLICATION STYLES                             -->
    <!-- ============================================== -->

    <!-- Main application stylesheet. -->
    <link rel="stylesheet" href="./assets/css/style.css">


</head>

<body>
    <main id="app">

        <h1>PWA INSTALL</h1>

        <!-- Application content goes here. -->

    </main>


    <!-- ============================================== -->
    <!-- APPLICATION JAVASCRIPT                         -->
    <!-- ============================================== -->

    <!-- Main application JavaScript. -->
    <script src="./assets/js/app.js" defer></script>


</body>
</html>
